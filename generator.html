<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Page Generator — The Epoch Institute</title>
<style>
  body { font-family: monospace; background: #0d0d0d; color: #c9a84c; padding: 40px; max-width: 800px; margin: 0 auto; }
  h1 { font-size: 18px; letter-spacing: 0.1em; margin-bottom: 8px; }
  p  { color: #888; font-size: 13px; line-height: 1.6; margin: 0 0 24px; }
  button {
    background: none; border: 1px solid #c9a84c; color: #c9a84c;
    padding: 12px 28px; cursor: pointer; font-family: monospace;
    font-size: 13px; letter-spacing: 0.08em; transition: background 0.2s;
  }
  button:hover { background: rgba(201,168,76,0.1); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #log { margin-top: 24px; font-size: 12px; color: #666; line-height: 1.8; max-height: 300px; overflow-y: auto; }
  #log .ok  { color: #5a8; }
  #log .err { color: #c55; }
  #log .hd  { color: #c9a84c; }
  a.dl { display: inline-block; margin-top: 20px; color: #c9a84c; font-size: 13px; }
</style>
</head>
<body>

<h1>Empire Page Generator</h1>
<p>
  Loads <code>shared-data.js</code> and generates <strong>all profile pages</strong> bundled into a ZIP file.<br>
  Host this file alongside <code>shared-data.js</code> (either upload both to your server or use a local dev server).<br>
  After generation, extract the ZIP and upload the <code>empire/</code> folder to your hosting.
</p>

<button id="gen-btn" onclick="generate()">Generate All Empire Pages →</button>

<div id="log"></div>

<!-- JSZip CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- Site data -->
<script src="shared-data.js"></script>
<script src="empire-profiles.js"></script>
<script src="encyclopedia-links.js"></script>
<script src="empire-section-images.js"></script>
<script src="empire-facts.js"></script>
<script src="empire-glance.js"></script>
<script>
// ── Encyclopedia links: gold, clickable mentions of encyclopedia entries ──────
// Wikipedia convention: link the first mention of each entry per section, never inside tags,
// longest match wins where names overlap, and an empire never links to itself.
// A name several entries share (group rows "@g") goes to the one that fits the year in the sentence or the profile's
// period (ENC_FN.pick, defined in encyclopedia-links.js); a dated event next to a contradicting year is not linked.
var ENC_RX = null;
function encCompile() {
  if (ENC_RX) return;
  ENC_RX = ENC_LINKS.e.map(function (en) {
    return { slug: en[0], g: en[0] === '@g' ? { m: en[2], p: en[3] } : null, rx: en[1].map(function (p) {
      try { return ENC_FN.rx(p[0], p[1]); } catch (err) { console.warn('Skipped pattern', en[0], p[0]); return null; }
    }).filter(Boolean) };
  });
}
function encCtx(empireName) {
  var e = EMPIRES.filter(function (x) { return x.name === empireName; })[0]; if (!e) return null;
  return (e.points && e.points.length) ? yearsOf(e) : [e.start, e.end == null ? 2025 : e.end];
}
function linkify(html, empireName) {
  if (typeof ENC_LINKS === 'undefined' || !html) return html;
  encCompile();
  var idxs = (ENC_LINKS.byEmpire[empireName] || []).slice(), self = ENC_LINKS.self[empireName];
  var ctx = encCtx(empireName), ex = {}; ((ENC_LINKS.ex || {})[empireName] || []).forEach(function (s) { ex[s] = 1; });
  // The empire's own name still claims its text (so "Caliphate" inside "Abbasid Caliphate" is not
  // linked on its own), but is never turned into a link.
  ENC_RX.forEach(function (en, i) { if (en.slug === self && idxs.indexOf(i) === -1) idxs.push(i); });
  var parts = html.split(/(<[^>]+>)/), cands = [];
  idxs.forEach(function (i) {
    var en = ENC_RX[i]; if (!en) return;
    en.rx.forEach(function (rx) {
      for (var p = 0; p < parts.length; p += 2) {
        var t = parts[p], m; if (!t) continue; rx.lastIndex = 0;
        while ((m = rx.exec(t))) {
          if (!m[0].length) { rx.lastIndex++; continue; }
          var s = m.index, e = s + m[0].length, slug = en.slug;
          // undecided group / wrong year / excluded: the text is still claimed, so no shorter name inside it links
          if (en.g) slug = ENC_FN.pick(en.g.m, t, s, e, ctx, ex, en.g.p);
          else if (ex[slug] || !ENC_FN.ok(slug, t, s, e)) slug = null;
          cands.push({ p: p, s: s, e: e, slug: slug });
        }
      }
    });
  });
  cands.sort(function (a, b) { return a.p - b.p || a.s - b.s || (b.e - b.s) - (a.e - a.s) || (b.slug ? 1 : 0) - (a.slug ? 1 : 0); });
  var used = {}, chosen = {}, lastP = -1, lastEnd = -1;
  cands.forEach(function (c) {
    if (c.p === lastP && c.s < lastEnd) return;
    if (!c.slug) { lastP = c.p; lastEnd = c.e; return; }
    if (used[c.slug]) return;
    used[c.slug] = 1; (chosen[c.p] = chosen[c.p] || []).push(c); lastP = c.p; lastEnd = c.e;
  });
  Object.keys(chosen).forEach(function (p) {
    var t = parts[p];
    chosen[p].sort(function (a, b) { return b.s - a.s; }).forEach(function (c) {
      if (c.slug === self) return;
      var txt = t.slice(c.s, c.e), tail = '';
      var poss = txt.match(/(['’]s)$/); if (poss) { tail = poss[1]; txt = txt.slice(0, -tail.length); }
      t = t.slice(0, c.s) + '<a class="enc-link" href="/encyclopedia/' + c.slug + '">' + txt + '</a>' + tail + t.slice(c.e);
    });
    parts[p] = t;
  });
  return parts.join('');
}
</script>
<script>
function log(msg, cls) {
  var el = document.getElementById('log');
  var line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatYear(y) {
  var yr = Math.round(y);
  return yr < 0 ? Math.abs(yr) + ' BCE' : yr + ' CE';
}

// ── Key facts, reading time, table of contents, related empires ──────────────
var EMPIRE_ALIAS = { 'Neo-Babylonian Empire': 'Chaldean Empire', 'Zand dynasty': 'Zand Empire', 'Mughal dynasty': 'Mughal Empire',
  'Safavid dynasty': 'Safavid Empire', 'Qing dynasty': 'Qing Empire', 'Ming dynasty': 'Ming Empire', 'Yuan Dynasty': 'Yuan Dynasty',
  'Sasanian dynasty': 'Sasanian Empire', 'Parthian dynasty': 'Parthian Empire', 'Seljuk dynasty': 'Seljuk Empire',
  'Byzantine Empire (Eastern Roman Empire)': 'Byzantine Empire', 'Western Roman Empire': 'Roman Empire' };
function empireByName(n) {
  n = EMPIRE_ALIAS[n] || n;
  for (var i = 0; i < EMPIRES.length; i++) if (EMPIRES[i].name === n) return EMPIRES[i];
  return null;
}
function yearsOf(e) { return [e.points[0][0], e.points[e.points.length - 1][0]]; }
// "A, B" -> each part linked to its empire page if it is one of the 94, else encyclopedia links via linkify
function linkStates(value, selfName) {
  return value.split(/,\s+/).map(function (part) {
    var e = empireByName(part);
    if (e && e.name !== selfName) return '<a class="enc-link" href="/empire/' + toSlug(e.name) + '">' + esc(part) + '</a>';
    return linkify(esc(part), selfName);
  }).join(', ');
}
function factRows(name, emp) {
  var f = (typeof EMPIRE_FACTS !== 'undefined' && EMPIRE_FACTS[name]) || {}, rows = '';
  // a kind of profile without a power curve names its own facts (a religion's scriptures, a language's family)
  var kf = PROFILE_KINDS[profileKind(emp)].facts;
  (kf ? kf.map(function (r) { return [r[0], r[1], false]; }) : [['capital', 'Capital', false], ['founder', 'Founder', false], ['predecessor', 'Preceded by', true], ['successor', 'Succeeded by', true]]).forEach(function (r) {
    if (!f[r[0]]) return;
    var val = r[2] ? linkStates(f[r[0]], name) : linkify(esc(f[r[0]]), name);
    rows += '          <div class="info-stat"><span class="info-stat-label">' + r[1] + '</span><span class="info-stat-val">' + val + '</span></div>\n';
  });
  return rows;
}
function readingMinutes(profile, emp) {
  if (!profile) return 0;
  var text = PROFILE_KINDS[profileKind(emp)].sections.map(function (s) { return s[0]; }).concat(['summary']).map(function (k) { return profile[k] || ''; }).join(' ');
  var words = text.replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 230));
}
function tocHtml(sectionKeys, profile, lead, tail) {
  if (!profile) return '';
  var items = (lead || []).concat(sectionKeys.filter(function (p) { return profile[p[0]]; }).map(function (p) { return [p[0], p[1]]; }));
  if (profile.summary) items.push(['summary', 'Summary']);
  (tail || []).forEach(function (t) { items.push(t); });
  if (Array.isArray(profile.references) && profile.references.length) items.push(['detail-references', 'References']);
  return '<nav class="empire-toc" aria-label="On this page">\n      <p class="empire-toc-title">On this page</p>\n      <ul>' +
    items.map(function (it) { return '<li><a href="#' + it[0] + '">' + it[1] + '</a></li>'; }).join('') + '</ul>\n    </nav>';
}
function empireCard(e, label) {
  var y = profileSpan(e);
  return '<a class="related-card" href="' + profileUrl(e) + '">' +
    (label ? '<span class="related-card-label">' + label + '</span>' : '') +
    '<img src="/logos/thumbs/' + encodeURIComponent(e.name) + '.png" alt="" loading="lazy" width="40" height="40" onerror="this.style.visibility=\'hidden\'">' +
    '<span class="related-card-name">' + esc(e.name) + '</span>' +
    '<span class="related-card-dates">' + (e.points && e.points.length ? formatYear(y[0]) + ' – ' + formatYear(y[1]) : esc(profileSpanText(e))) + '</span></a>';
}
// the same kind's other profiles (religions, languages …): the four nearest in time, and the earlier and later ones
function kindRelatedHtml(emp) {
  var k = profileKind(emp), mine = EMPIRES.filter(function (e) { return profileKind(e) === k; }), y = profileSpan(emp)[0];
  var near = mine.filter(function (e) { return e !== emp; }).sort(function (a, b) { return Math.abs(profileSpan(a)[0] - y) - Math.abs(profileSpan(b)[0] - y) || a.name.localeCompare(b.name); }).slice(0, 4);
  var chrono = mine.slice().sort(function (a, b) { return profileSpan(a)[0] - profileSpan(b)[0] || a.name.localeCompare(b.name); });
  var i = chrono.indexOf(emp), prev = chrono[i - 1], next = chrono[i + 1];
  if (!near.length) return '';
  return '<section class="related-empires" aria-labelledby="related-title">\n' +
    '      <p class="profile-references-title" id="related-title">Other ' + PROFILE_KINDS[k].single.toLowerCase() + 's</p>\n' +
    '      <div class="related-grid">' + near.map(function (e) { return empireCard(e); }).join('') + '</div>\n' +
    '      <div class="related-prevnext">' + (prev ? empireCard(prev, '← Earlier') : '<span></span>') + (next ? empireCard(next, 'Later →') : '') + '</div>\n' +
    '    </section>';
}
function relatedHtml(emp) {
  var y = yearsOf(emp), polities = EMPIRES.filter(function (e) { return profileKind(e) === 'polity'; });
  var same = polities.filter(function (e) { return e.name !== emp.name && e.region === emp.region; }).map(function (e) {
    var z = yearsOf(e), overlap = Math.min(y[1], z[1]) - Math.max(y[0], z[0]);
    return { e: e, score: overlap > 0 ? 100000 + overlap : -Math.abs(overlap) };   // overlapping first, then nearest in time
  }).sort(function (a, b) { return b.score - a.score; }).slice(0, 4).map(function (x) { return x.e; });
  var chrono = polities.slice().sort(function (a, b) { return yearsOf(a)[0] - yearsOf(b)[0] || a.name.localeCompare(b.name); });
  var i = chrono.indexOf(emp), prev = chrono[i - 1], next = chrono[i + 1];
  return '<section class="related-empires" aria-labelledby="related-title">\n' +
    '      <p class="profile-references-title" id="related-title">Related states and empires</p>\n' +
    '      <div class="related-grid">' + same.map(function (e) { return empireCard(e); }).join('') + '</div>\n' +
    '      <div class="related-prevnext">' + (prev ? empireCard(prev, '← Earlier') : '<span></span>') + (next ? empireCard(next, 'Later →') : '') + '</div>\n' +
    '    </section>';
}

// ── At a glance (takeaways + did you know), rise-and-fall chart, key events (empire-glance.js) ──
function glanceOf(name) { return (typeof GLANCE !== 'undefined' && GLANCE[name]) || null; }
function glanceHtml(name) {
  var g = glanceOf(name); if (!g) return '';
  return '<section class="empire-glance" id="at-a-glance" aria-labelledby="glance-title">\n' +
    '      <div class="empire-glance-main"><h2 class="empire-glance-title" id="glance-title">At a glance</h2><ul>' +
    g.t.map(function (t) { return '<li>' + linkify(esc(t), name) + '</li>'; }).join('') + '</ul></div>\n' +
    '      <aside class="empire-dyk"><p class="empire-dyk-title">Did you know?</p><p>' + linkify(esc(g.dyk), name) + '</p></aside>\n' +
    '    </section>';
}
// "c. 1250 BCE" -> -1250, "330" -> 330, "13th century" -> 1250, "Mid-13th century BCE" -> -1250; null if no number
function eventYear(s) {
  var bce = /BCE|BC\b/.test(s), m = s.match(/(\d{1,2})(?:st|nd|rd|th)\s+centur/i), n;
  if (m) n = (parseInt(m[1], 10) - 1) * 100 + 50;
  else { m = s.match(/\d{1,4}/); if (!m) return null; n = parseInt(m[0], 10); }
  return bce ? -n : n;
}
function riseFallHtml(emp, name, isPolity) {
  var g = glanceOf(name); if (!g && !isPolity) return '';
  var svg = '';
  if (isPolity && emp.points && emp.points.length > 1) {
    var W = 760, H = 206, PX = 20, PT = 26, PB = 46, pts = emp.points.slice().sort(function (a, b) { return a[0] - b[0]; });
    var y0 = pts[0][0], y1 = pts[pts.length - 1][0], span = (y1 - y0) || 1;
    var X = function (y) { return PX + (y - y0) / span * (W - 2 * PX); }, Y = function (v) { return H - PB - v / 10 * (H - PT - PB); };
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join(' ');
    var area = line + ' L' + X(y1).toFixed(1) + ' ' + (H - PB) + ' L' + X(y0).toFixed(1) + ' ' + (H - PB) + ' Z';
    var peak = pts.reduce(function (m, p) { return p[1] >= m[1] ? p : m; });
    var ticks = '';
    (g ? g.ev : []).forEach(function (e, i) {
      var yr = eventYear(e[0]); if (yr === null || yr < y0 - span * 0.1 || yr > y1 + span * 0.1) return;
      var x = X(Math.min(Math.max(yr, y0), y1)).toFixed(1);
      ticks += '<g class="rf-ev"><line x1="' + x + '" x2="' + x + '" y1="' + (H - PB) + '" y2="' + (H - PB + 6) + '"/><circle cx="' + x + '" cy="' + (H - PB) + '" r="8"/><text x="' + x + '" y="' + (H - PB + 4) + '" text-anchor="middle">' + (i + 1) + '</text><title>' + esc(e[0] + ': ' + e[1]) + '</title></g>';
    });
    svg = '<figure class="rf-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Relative power of the ' + esc(name) + ' over time, peaking in ' + formatYear(peak[0]) + '">' +
      '<line class="rf-base" x1="' + PX + '" x2="' + (W - PX) + '" y1="' + (H - PB) + '" y2="' + (H - PB) + '"/>' +
      '<path class="rf-area" d="' + area + '"/><path class="rf-line" d="' + line + '"/>' +
      '<circle class="rf-peak" cx="' + X(peak[0]).toFixed(1) + '" cy="' + Y(peak[1]).toFixed(1) + '" r="5"/>' +
      '<text class="rf-peak-label" x="' + X(peak[0]).toFixed(1) + '" y="' + (Y(peak[1]) - 10).toFixed(1) + '" text-anchor="middle">Peak ' + formatYear(peak[0]) + '</text>' +
      ticks +
      '<text class="rf-axis" x="' + PX + '" y="' + (H - 6) + '">' + formatYear(y0) + '</text>' +
      '<text class="rf-axis" x="' + (W - PX) + '" y="' + (H - 6) + '" text-anchor="end">' + formatYear(y1) + '</text>' +
      '</svg><figcaption>Relative power on the Institute\'s 0–10 scale (each profile scaled to its own peak). Numbers mark the key events below.</figcaption></figure>';
  }
  var list = g ? '<ol class="rf-events">' + g.ev.map(function (e) {
    return '<li><span class="rf-year">' + esc(e[0]) + '</span><span class="rf-text">' + linkify(esc(e[1]), name) + '</span></li>';
  }).join('') + '</ol>' : '';
  return '<section class="rise-fall" id="timeline" aria-labelledby="timeline-title">\n' +
    '      <h2 class="profile-section-title" id="timeline-title">' + (isPolity ? 'Rise &amp; Fall' : 'Timeline') + '</h2>\n      ' + svg + list + '\n    </section>';
}

// "Write in …" (scribe.js, data/scribe/<slug>.json): the languages with a script of their own; the four written in the
// Latin alphabet (Latin, Nahuatl, Swahili, Quechua) have no keyboard of their own
var SCRIBE_LANGS = ['Sumerian', 'Akkadian', 'Ancient Egyptian', 'Ancient Greek', 'Aramaic', 'Sanskrit', 'Classical Chinese', 'Arabic', 'Persian', 'Old Turkic', 'Hebrew', 'Old Norse'];
function hasScribe(emp) { return profileKind(emp) === 'language' && SCRIBE_LANGS.indexOf(emp.name) >= 0; }
function scribeHtml(emp) {
  if (!hasScribe(emp)) return '';
  var slug = toSlug(emp.name);
  return '<section class="scribe-sec" id="write" aria-labelledby="write-title">\n' +
    '      <h2 class="profile-section-title" id="write-title">Write in ' + esc(emp.name) + '</h2>\n' +
    '      <p class="scribe-lede">Type in the script itself: every key shows a sign with its value and how it sounds. Then make a picture of what you wrote, to save, copy or share.</p>\n' +
    '      <div class="scribe" data-lang="' + slug + '"><p class="scr-loading">The keyboard opens here once the page has loaded.</p></div>\n' +
    '      <p class="scribe-more"><a href="/write#' + slug + '">All twelve scripts on one page &rarr;</a></p>\n' +
    '    </section>';
}

// "Spread through the centuries" (faith-map.js, data/faiths/<slug>.json from scripts/faiths.tsv): every religion
function hasFaithMap(emp) { return profileKind(emp) === 'religion'; }
function faithMapHtml(emp) {
  if (!hasFaithMap(emp)) return '';
  var slug = toSlug(emp.name);
  return '<section class="fm-sec" id="faith-map" aria-labelledby="faith-map-title">\n' +
    '      <h2 class="profile-section-title" id="faith-map-title">Spread through the centuries</h2>\n' +
    '      <p class="fm-lede">Where it began, how it spread, and where it was a main faith (a bright glow) or held communities (a faint one), century by century' + (emp.end == null ? ' to today' : ' to its last places') + '. Press Play or move the slider, turn the globe, and tap a glow or a mark to read about it.</p>\n' +
    '      <div class="faith-map" data-faith="' + slug + '"><p class="fm-loading">The map opens here once the page has loaded.</p></div>\n' +
    '      <p class="fm-more"><a href="/faiths?faith=' + slug + '">Compare it with another faith &rarr;</a></p>\n' +
    '    </section>';
}

// "Test yourself" (test-yourself.js): up to five questions built only from the profile's own key events (empire-glance.js,
// firm years) and facts (empire-facts.js), the wrong answers from profiles of the same kind and region, nearest in time
// first. Seeded by the name, so the page comes out the same on every run. Shown when there are at least three.
function tyRng(seed) {
  var h = 2166136261; for (var i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
  return function () { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function tyShuffle(a, r) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function tyFirm(t) { var m = /^(\d{1,4})( BCE)?$/.exec(String(t).trim()); return m ? (m[2] ? -m[1] : +m[1]) : null; }
function tyYear(y) { return y < 0 ? -y + ' BCE' : String(y); }
// clean proper names from a facts value ("Winchester; later London", "No common capital; chief cities Kano" -> names only)
var TY_BAD = /^(no|none|various|several|many|shifting|itinerant|uncertain|unknown|multiple|royal|citizens|chief|the|a|an)\b/i;
var TY_ADJ = /^(Senior|Middle|Junior|Upper|Lower|Northern|Southern|Eastern|Western|Central|Greater|Lesser|Inner|Outer|Little|Great|New|Old|Later|Early|Late)$/;
var TY_PART = /^(of|de|la|le|del|al|el|the|and|du|des|da|di|von|van|ibn|bin|upon|on|in|y|zu|ad|an|en|na|ul|ud|ad-din|al-din)$/;
function tyNames(s) {
  return String(s || '').replace(/\([^)]*\)/g, ' ').split(/;|,|\/| and | then | later /).map(function (x) {
    // "Honolulu under Kamehameha I", "Kutaisi in the west"; "in" with a capital stays: French Establishments in Oceania
    return x.replace(/\s+(?:(?:under|until|from|after|before|during)\s|in\s+[a-z0-9]).*$/, '').replace(/\s+/g, ' ').trim();
  }).filter(function (x) {
    return x && /^[A-ZÀ-ɏʻ]/.test(x) && !/\d/.test(x) && !TY_BAD.test(x) && !TY_ADJ.test(x) && x.split(' ').length <= 5 &&
      x.split(' ').every(function (w) { return /^[A-ZÀ-ɏʻ'’-]/.test(w) || TY_PART.test(w) || /^[IVX]+$/.test(w); }) &&
      !/\b(capital|capitals|court|seat|seats|city-states|tribes|chiefs|clans|towns)\b/i.test(x);
  });

async function generate() {
  var btn = document.getElementById('gen-btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';

  log('Loading data…', 'hd');

  if (typeof EMPIRES === 'undefined' || typeof EMPIRE_PROFILES === 'undefined') {
    log('ERROR: shared-data.js not loaded. Make sure this page is served alongside shared-data.js.', 'err');
    btn.disabled = false;
    return;
  }

  log('Found ' + EMPIRES.length + ' empires. Generating pages…', 'hd');

  var zip = new JSZip();
  for (var i = 0; i < EMPIRES.length; i++) {
    var emp  = EMPIRES[i];
    var slug = profileUrl(emp).slice(1);   // e.g. empire/roman-empire, culture/<slug>
    try {
      var html = buildPage(emp);
      zip.file(slug, html);
      log('[' + (i+1) + '/' + EMPIRES.length + '] ' + emp.name + ' → ' + slug, 'ok');
    } catch (err) {
      log('ERROR: ' + emp.name + ': ' + err.message, 'err');
    }
  }

  log('\nPacking ZIP…', 'hd');
  var blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = 'empire-pages.zip';
  a.className = 'dl';
  a.textContent = '↓ Download empire-pages.zip (' + EMPIRES.length + ' files)';
  document.getElementById('log').appendChild(a);
  a.click();
  log('Done. Extract the ZIP to get the empire/ folder.', 'hd');
  btn.disabled = false;
}
