  body { font-family: monospace; background: #0d0d0d; color: #c9a84c; padding: 40px; max-width: 800px; margin: 0 auto; }
  h1 { font-size: 18px; letter-spacing: 0.1em; margin-bottom: 8px; }
  p  { color: #888; font-size: 13px; line-height: 1.6; margin: 0 0 24px; }
  button {
    background: none; border: 1px solid #c9a84c; color: #c9a84c;

  }

  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #log { margin-top: 24px; font-size: 12px; color: #666; line-height: 1.8; max-height: 300px; overflow-y: auto; }

<body>

<h1>Empire Page Generator</h1>
<p>
  Loads <code>shared-data.js</code> and generates <strong>94 empire HTML pages</strong> bundled into a ZIP file.<br>
  Host this file alongside <code>shared-data.js</code> (either upload both to your server or use a local dev server).<br>
  After generation, extract the ZIP and upload the <code>empire/</code> folder to your hosting.
</p>

<button id="gen-btn" onclick="generate()">Generate All Empire Pages →</button>

<div id="log"></div>

<!-- JSZip CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- Site data -->
<script src="shared-data.js"></script>
<script src="empire-profiles.js"></script>
<script src="encyclopedia-links.js"></script>
<script src="empire-section-images.js"></script>
<script src="empire-facts.js"></script>
<script>
// ── Encyclopedia links: gold, clickable mentions of encyclopedia entries ──────
// Wikipedia convention: link the first mention of each entry per section, never inside tags,
// longest match wins where names overlap, and an empire never links to itself.
var ENC_RX = null;
function encCompile() {
  if (ENC_RX) return;
  ENC_RX = ENC_LINKS.e.map(function (en) {
    return { slug: en[0], rx: en[1].map(function (p) {
      try { return new RegExp(p[0], 'gu' + (p[1] ? 'i' : '')); } catch (err) { console.warn('Skipped pattern', en[0], p[0]); return null; }
    }).filter(Boolean) };
  });
}
function linkify(html, empireName) {
  if (typeof ENC_LINKS === 'undefined' || !html) return html;
  encCompile();
  var idxs = (ENC_LINKS.byEmpire[empireName] || []).slice(), self = ENC_LINKS.self[empireName];
  // The empire's own name still claims its text (so "Caliphate" inside "Abbasid Caliphate" is not
  // linked on its own), but is never turned into a link.
  ENC_RX.forEach(function (en, i) { if (en.slug === self && idxs.indexOf(i) === -1) idxs.push(i); });
  var parts = html.split(/(<[^>]+>)/), cands = [];
  idxs.forEach(function (i) {
    var en = ENC_RX[i]; if (!en) return;
    en.rx.forEach(function (rx) {
      for (var p = 0; p < parts.length; p += 2) {
        var t = parts[p], m; if (!t) continue; rx.lastIndex = 0;
        while ((m = rx.exec(t))) {
          if (!m[0].length) { rx.lastIndex++; continue; }
          cands.push({ p: p, s: m.index, e: m.index + m[0].length, slug: en.slug });
        }
      }
    });
  });
  cands.sort(function (a, b) { return a.p - b.p || a.s - b.s || (b.e - b.s) - (a.e - a.s); });
  var used = {}, chosen = {}, lastP = -1, lastEnd = -1;
  cands.forEach(function (c) {
    if (c.p === lastP && c.s < lastEnd) return;
    if (used[c.slug]) return;
    used[c.slug] = 1; (chosen[c.p] = chosen[c.p] || []).push(c); lastP = c.p; lastEnd = c.e;
  });
  Object.keys(chosen).forEach(function (p) {
    var t = parts[p];
    chosen[p].sort(function (a, b) { return b.s - a.s; }).forEach(function (c) {
      if (c.slug === self) return;
      var txt = t.slice(c.s, c.e), tail = '';
      var poss = txt.match(/(['’]s)$/); if (poss) { tail = poss[1]; txt = txt.slice(0, -tail.length); }
      t = t.slice(0, c.s) + '<a class="enc-link" href="/encyclopedia#' + c.slug + '">' + txt + '</a>' + tail + t.slice(c.e);
    });
    parts[p] = t;
  });
  return parts.join('');
}
</script>
<script>
function log(msg, cls) {
  var el = document.getElementById('log');
  var line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatYear(y) {
  var yr = Math.round(y);
  return yr < 0 ? Math.abs(yr) + ' BCE' : yr + ' CE';
}

// ── Key facts, reading time, table of contents, related empires ──────────────
var EMPIRE_ALIAS = { 'Neo-Babylonian Empire': 'Chaldean Empire', 'Zand dynasty': 'Zand Empire', 'Mughal dynasty': 'Mughal Empire',
  'Safavid dynasty': 'Safavid Empire', 'Qing dynasty': 'Qing Empire', 'Ming dynasty': 'Ming Empire', 'Yuan Dynasty': 'Yuan Dynasty',
  'Sasanian dynasty': 'Sasanian Empire', 'Parthian dynasty': 'Parthian Empire', 'Seljuk dynasty': 'Seljuk Empire',
  'Byzantine Empire (Eastern Roman Empire)': 'Byzantine Empire', 'Western Roman Empire': 'Roman Empire' };
function empireByName(n) {
  n = EMPIRE_ALIAS[n] || n;
  for (var i = 0; i < EMPIRES.length; i++) if (EMPIRES[i].name === n) return EMPIRES[i];
  return null;
}
function yearsOf(e) { return [e.points[0][0], e.points[e.points.length - 1][0]]; }
// "A, B" -> each part linked to its empire page if it is one of the 94, else encyclopedia links via linkify
function linkStates(value, selfName) {
  return value.split(/,\s+/).map(function (part) {
    var e = empireByName(part);
    if (e && e.name !== selfName) return '<a class="enc-link" href="/empire/' + toSlug(e.name) + '">' + esc(part) + '</a>';
    return linkify(esc(part), selfName);
  }).join(', ');
}
function factRows(name) {
  var f = (typeof EMPIRE_FACTS !== 'undefined' && EMPIRE_FACTS[name]) || {}, rows = '';
  [['capital', 'Capital', false], ['founder', 'Founder', false], ['predecessor', 'Preceded by', true], ['successor', 'Succeeded by', true]].forEach(function (r) {
    if (!f[r[0]]) return;
    var val = r[2] ? linkStates(f[r[0]], name) : linkify(esc(f[r[0]]), name);
    rows += '          <div class="info-stat"><span class="info-stat-label">' + r[1] + '</span><span class="info-stat-val">' + val + '</span></div>\n';
  });
  return rows;
}
function readingMinutes(profile) {
  if (!profile) return 0;
  var text = ['foundation','socioeconomy','military','governance','impact','decline','summary'].map(function (k) { return profile[k] || ''; }).join(' ');
  var words = text.replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 230));
}
function tocHtml(sectionKeys, profile) {
  if (!profile) return '';
  var items = [['empire-stats-panel', 'Historical analysis']].concat(sectionKeys.filter(function (p) { return profile[p[0]]; }).map(function (p) { return [p[0], p[1]]; }));
  if (profile.summary) items.push(['summary', 'Summary']);
  if (Array.isArray(profile.references) && profile.references.length) items.push(['detail-references', 'References']);
  return '<nav class="empire-toc" aria-label="On this page">\n      <p class="empire-toc-title">On this page</p>\n      <ul>' +
    items.map(function (it) { return '<li><a href="#' + it[0] + '">' + it[1] + '</a></li>'; }).join('') + '</ul>\n    </nav>';
}
function empireCard(e, label) {
  var y = yearsOf(e);
  return '<a class="related-card" href="/empire/' + toSlug(e.name) + '">' +
    (label ? '<span class="related-card-label">' + label + '</span>' : '') +
    '<img src="/logos/' + encodeURIComponent(e.name) + '.png" alt="" loading="lazy" width="40" height="40" onerror="this.style.visibility=\'hidden\'">' +
    '<span class="related-card-name">' + esc(e.name) + '</span>' +
    '<span class="related-card-dates">' + formatYear(y[0]) + ' – ' + formatYear(y[1]) + '</span></a>';
}
function relatedHtml(emp) {
  var y = yearsOf(emp);
  var same = EMPIRES.filter(function (e) { return e.name !== emp.name && e.region === emp.region; }).map(function (e) {
    var z = yearsOf(e), overlap = Math.min(y[1], z[1]) - Math.max(y[0], z[0]);
    return { e: e, score: overlap > 0 ? 100000 + overlap : -Math.abs(overlap) };   // overlapping first, then nearest in time
  }).sort(function (a, b) { return b.score - a.score; }).slice(0, 4).map(function (x) { return x.e; });
  var chrono = EMPIRES.slice().sort(function (a, b) { return yearsOf(a)[0] - yearsOf(b)[0] || a.name.localeCompare(b.name); });
  var i = chrono.indexOf(emp), prev = chrono[i - 1], next = chrono[i + 1];
  return '<section class="related-empires" aria-labelledby="related-title">\n' +
    '      <p class="profile-references-title" id="related-title">Related empires</p>\n' +
    '      <div class="related-grid">' + same.map(function (e) { return empireCard(e); }).join('') + '</div>\n' +
    '      <div class="related-prevnext">' + (prev ? empireCard(prev, '← Earlier') : '<span></span>') + (next ? empireCard(next, 'Later →') : '') + '</div>\n' +
    '    </section>';
}

// One picture per profile section (empire-section-images.js), linked to its encyclopedia entry, with credit.
function sectionFigure(empireName, key) {
  var f = typeof SECTION_IMAGES !== 'undefined' && SECTION_IMAGES[empireName] && SECTION_IMAGES[empireName][key];
  if (!f) return '';
  var credit = [f.artist, f.licence].filter(Boolean).map(esc).join(', ');
  return '<figure class="profile-section-fig"><a href="/encyclopedia#' + f.slug + '"><img src="' + esc(f.img) + '" alt="' + esc(f.name) + '" loading="lazy" width="240"></a>' +
    '<figcaption><a href="/encyclopedia#' + f.slug + '">' + esc(f.name) + '</a>' +
    (credit ? '<span class="profile-section-fig-credit">' + (f.source ? '<a href="' + esc(f.source) + '" target="_blank" rel="noopener">' + credit + '</a>' : credit) + '</span>' : '') +
    '</figcaption></figure>\n        ';
}

function buildPage(emp) {
  var name    = emp.name;
  var slug    = toSlug(name);
  var region  = emp.region || '';
  var profile = EMPIRE_PROFILES[name];
  var info    = EMPIRE_INFO[name] || '';

  var pts      = emp.points;
  var startY   = pts[0][0];
  var endY     = pts[pts.length - 1][0];
  var peakPt   = pts.reduce(function(m,p){ return p[1]>=m[1]?p:m; });
  var peakY    = peakPt[0];
  var duration = Math.abs(Math.round(endY - startY));
  var peakStr  = formatYear(peakY);
  var period   = formatYear(startY) + ' – ' + formatYear(endY);

  var metaDesc = info
    ? info.slice(0, 155).replace(/"/g,"'") + (info.length > 155 ? '…' : '')
    : 'Explore the history of the ' + name + ' — foundation, military, governance, and decline.';

  var sectionKeys = [
    ['foundation','Foundation'],['socioeconomy','Socioeconomy'],['military','Military'],
    ['governance','Governance &amp; Law'],['impact','Global &amp; Regional Impact'],['decline','Decline &amp; Fall']
  ];

  var sectionsHtml = '';
  if (profile) {
    sectionsHtml = sectionKeys.map(function(pair) {
      var key = pair[0], label = pair[1];
      var body = profile[key] ? linkify(profile[key], name) : '<em>Description coming soon.</em>';
      return '<div class="profile-section-block" id="'+key+'">\n        <h2 class="profile-section-title">'+label+'</h2>\n        '+sectionFigure(name, key)+'<div class="profile-section-body">'+body+'</div>\n      </div>';
    }).join('\n      ');
  }

  var summaryHtml = (profile && profile.summary)
    ? '<p class="profile-summary" id="summary"><em>'+linkify(esc(profile.summary), name)+'</em></p>'
    : (info ? '<p class="profile-summary">'+linkify(esc(info), name)+'</p>' : '');

  var referencesHtml = '';
  if (profile && Array.isArray(profile.references) && profile.references.length) {
    referencesHtml = '<div id="detail-references" class="profile-references">\n      <p class="profile-references-title">References</p>\n      <ul class="profile-references-list">\n        ' +
      profile.references.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('\n        ') +
      '\n      </ul>\n    </div>';
  }

  var noProfileNote = !profile
    ? '<div style="padding:48px 0;text-align:center;"><p style="font-family:var(--font-ui);font-size:13px;letter-spacing: 0.06em;color:var(--muted);text-transform:uppercase;margin:0 0 16px; font-weight: 600;">Full profile coming soon</p>' +
      (info ? '<p style="font-family:var(--font-text);font-size:18px;color:var(--text);line-height:1.75;max-width:720px;margin:0 auto;">'+esc(info)+'</p>' : '') +
      '</div>'
    : '';

  var canonicalUrl = 'https://the-epoch-institute.org/empire/' + slug;
  var encodedName  = encodeURIComponent(name);

  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' +
'<script>(function(){var t=localStorage.getItem(\'epoch-theme\');if(t===\'light\')document.documentElement.setAttribute(\'data-theme\',\'light\');else if(t===\'dark\')document.documentElement.setAttribute(\'data-theme\',\'dark\');})()\x3C/script>\n' +
'<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
'<title>'+esc(name)+' — The Epoch Institute</title>\n' +
'<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 32 32\'%3E%3Crect width=\'32\' height=\'32\' fill=\'%230d0d0d\'/%3E%3Ctext x=\'16\' y=\'23\' font-family=\'serif\' font-size=\'22\' font-weight=\'700\' fill=\'%23c9a84c\' text-anchor=\'middle\'%3EE%3C/text%3E%3C/svg%3E">\n' +
'<meta name="description" content="'+esc(metaDesc)+'">\n' +
'<meta property="og:title" content="'+esc(name)+' — The Epoch Institute">\n' +
'<meta property="og:description" content="'+esc(metaDesc)+'">\n' +
'<meta property="og:type" content="article">\n' +
'<meta property="og:url" content="'+canonicalUrl+'">\n' +
'<link rel="canonical" href="'+canonicalUrl+'">\n' +
'<link rel="stylesheet" href="/shared.css?v=7">\n' +
'<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
'<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
'<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">\n' +
'<style>\n' +
'.empire-page { padding-top: 80px; min-height: 100vh; }\n' +
'.info-share-row { display:flex; gap:10px; margin:20px 0 0; }\n' +
'.info-share-btn { display:flex; align-items:center; gap:6px; font-family:var(--font-ui); font-size:12px; letter-spacing: 0.06em; text-transform:uppercase; color:var(--muted); background:none; border:0.5px solid var(--border); padding:7px 14px; cursor:pointer; transition:border-color 0.2s,color 0.2s; border-radius:2px; font-weight: 600;}\n' +
'.info-share-btn:hover { border-color:var(--gold); color:var(--gold); }\n' +
'.empire-nav-row { display:flex; justify-content:space-between; align-items:center; padding:0 40px 0; max-width:900px; margin:0 auto 24px; flex-wrap:wrap; gap:12px; }\n' +
'.empire-view-explorer { font-family:var(--font-ui); font-size:12px; letter-spacing: 0.06em; text-transform:uppercase; color:var(--muted); text-decoration:none; border:0.5px solid var(--border); padding:7px 14px; border-radius:2px; transition:border-color 0.2s,color 0.2s; font-weight: 600;}\n' +
'.empire-view-explorer:hover { border-color:var(--gold); color:var(--gold); }\n' +

'</style>\n' +
'<script async src="https://www.googletagmanager.com/gtag/js?id=G-B163TLDMP4">\x3C/script>\n' +
'<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag(\'js\',new Date());gtag(\'config\',\'G-B163TLDMP4\');\x3C/script>\n' +
'</head>\n<body>\n\n' +
'<div class="empire-page">\n' +
'  <div class="empire-nav-row">\n' +
'    <a href="/profiles" class="profile-back-gallery-btn">← Back to Profiles</a>\n' +
'    <a href="/explorer#//'+encodedName+'" class="empire-view-explorer">View on Explorer →</a>\n' +
'  </div>\n\n' +
'  <div class="profile-detail-inner">\n' +
'    <div class="profile-detail-header">\n' +
'      <img class="profile-detail-logo" id="detail-logo" src="/logos/'+encodedName+'.png" alt="'+esc(name)+'" onerror="this.style.display=\'none\'">\n' +
'      <div>\n' +
'        <p class="profile-detail-region">'+esc(region)+'</p>\n' +
'        <h1 class="profile-detail-name">'+esc(name)+'</h1>\n' +
'        <div class="info-stats" style="margin-top:10px;">\n' +
'          <div class="info-stat"><span class="info-stat-label">Peak</span><span class="info-stat-val">'+peakStr+'</span></div>\n' +
'          <div class="info-stat"><span class="info-stat-label">Duration</span><span class="info-stat-val">'+duration+' yrs</span></div>\n' +
'          <div class="info-stat"><span class="info-stat-label">Period</span><span class="info-stat-val">'+period+'</span></div>\n' +
factRows(name) +
'        </div>\n' +
(profile ? '        <p class="empire-meta">' + readingMinutes(profile) + ' min read · Last reviewed October 2026</p>\n' : '') +
'      </div>\n' +
'    </div>\n\n' +
'    ' + tocHtml(sectionKeys, profile) + '\n\n' +
'    <div id="empire-stats-panel" data-empire="'+esc(name)+'"></div>\n\n' +
noProfileNote + '\n' +
(sectionsHtml ? '    ' + sectionsHtml + '\n' : '') +
(summaryHtml ? '\n    ' + summaryHtml + '\n' : '') +
(referencesHtml ? '\n    ' + referencesHtml + '\n' : '') +
'\n    ' + relatedHtml(emp) + '\n' +
'\n' +
'    <div class="detail-cite-row" id="detail-cite-row">\n' +
'      <button class="detail-cite-btn" id="detail-cite-btn"><span class="detail-cite-icon">"</span>Cite this profile</button>\n' +
'      <div class="cite-dropdown" id="cite-dropdown"></div>\n' +
'    </div>\n\n' +
'    <div class="info-share-row" style="margin-top:28px;padding-top:20px;border-top:0.5px solid var(--border);">\n' +
'      <button class="info-share-btn" id="share-x"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Share on X</button>\n' +
'      <button class="info-share-btn" id="share-li"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>Share on LinkedIn</button>\n' +
'    </div>\n' +
'  </div>\n</div>\n\n' +
'<script src="/shared-data.js?v=2">\x3C/script>\n' +
'<script src="/shared-nav.js?v=4">\x3C/script>\n' +
'<script src="/epoch-stats.js?v=2">\x3C/script>\n' +
'<script>\n' +
'(function(){\n' +
'  var name="'+name.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'",slug="'+slug+'",url="https://the-epoch-institute.org/empire/'+slug+'";\n' +
'  var now=new Date(),months=["January","February","March","April","May","June","July","August","September","October","November","December"];\n' +
'  var day=now.getDate(),month=months[now.getMonth()],year=now.getFullYear();\n' +
'  var cites=[\n' +
'    {label:"Harvard",text:"The Epoch Institute Research Team (2024). "+name+". The Epoch Institute. Retrieved "+day+" "+month+" "+year+", from "+url},\n' +
'    {label:"APA",text:"The Epoch Institute Research Team. (2024). "+name+" [Research profile]. The Epoch Institute. "+url},\n' +
'    {label:"Chicago",text:\'The Epoch Institute Research Team. "\'+name+\'." The Epoch Institute, 2024. Accessed \'+month+" "+day+", "+year+". "+url}\n' +
'  ];\n' +
'  var dropdown=document.getElementById("cite-dropdown");\n' +
'  dropdown.innerHTML=cites.map(function(c,i){return \'<div class="cite-block"><div class="cite-block-header"><span class="cite-label">\'+c.label+\'</span><button class="cite-copy-btn" data-cite="\'+i+\'">Copy</button></div><p class="cite-text">\'+escHtml(c.text)+\'</p></div>\';}).join("");\n' +

async function generate() {
  var btn = document.getElementById('gen-btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';

  log('Loading data…', 'hd');

  if (typeof EMPIRES === 'undefined' || typeof EMPIRE_PROFILES === 'undefined') {
    log('ERROR: shared-data.js not loaded. Make sure this page is served alongside shared-data.js.', 'err');
    btn.disabled = false;
    return;
  }

  log('Found ' + EMPIRES.length + ' empires. Generating pages…', 'hd');

  var zip = new JSZip();
  var folder = zip.folder('empire');

  for (var i = 0; i < EMPIRES.length; i++) {
    var emp  = EMPIRES[i];
    var slug = toSlug(emp.name);
    try {
      var html = buildPage(emp);
      folder.file(slug, html);
      log('[' + (i+1) + '/' + EMPIRES.length + '] ' + emp.name + ' → ' + slug, 'ok');
    } catch (err) {
      log('ERROR: ' + emp.name + ': ' + err.message, 'err');
    }
  }

  log('\nPacking ZIP…', 'hd');
  var blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = 'empire-pages.zip';
  a.className = 'dl';
  a.textContent = '↓ Download empire-pages.zip (' + EMPIRES.length + ' files)';
  document.getElementById('log').appendChild(a);
  a.click();
  log('Done. Extract the ZIP to get the empire/ folder.', 'hd');
  btn.disabled = false;
}
</script>
