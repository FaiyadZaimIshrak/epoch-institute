# History Now's headlines, https://the-epoch-institute.org/feeds/news.json (shown on /now and the home page's Now card).
# Twice a day, and after a push that changes its sources, scripts/news/make-news.js reads the feeds of
# scripts/news/feeds.tsv and keeps the headlines that name a page of the site (headline, link, source, day, and the
# thumbnail a feed itself offers, resized here and written beside news.json as n-<id>.jpg);
# cPanel's UAPI writes the file into public_html/feeds, as daily-feed.yml does: no commit and no deploy. When a run
# fails or finds fewer than four headlines nothing is written and the last good file stays (the pages stop showing a
# file over ten days old). Uses the cPanel API secrets CPANEL_HOST, CPANEL_USER and CPANEL_API_TOKEN.

name: History news

on:
  schedule:
    - cron: '20 5,17 * * *'
  push:
    branches: [master]
    paths: ['scripts/news/**', '.github/workflows/news.yml']
  workflow_dispatch:

concurrency:
  group: history-news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAW_HOST: ${{ secrets.CPANEL_HOST }}
      USER: ${{ secrets.CPANEL_USER }}
      TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/news
            search-index.js
            search-profiles.js
            search-pages.js
            encyclopedia-data.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        run: |
          HOST=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')
          HOST="${HOST#http://}"; HOST="${HOST#https://}"; HOST="${HOST%%/*}"; HOST="${HOST%%:*}"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          for v in HOST USER TOKEN; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done

      - name: Read the feeds
        run: node scripts/news/make-news.js --out=news.json --img=pics

      # the thumbnails a feed offers, as 240 px square JPEGs (n-<id>.jpg); a headline whose picture cannot be made
      # falls back to the Institute's picture of its background page
      - name: Make the thumbnails
        run: |
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          for f in pics/*.src; do
            [ -e "$f" ] || continue
            convert "${f}[0]" -auto-orient -resize '240x240^' -gravity center -extent 240x240 -strip -quality 80 "${f%.src}.jpg" || echo "::warning::could not convert $f"
            rm -f "$f"
          done
          node -e "
            const fs = require('fs'), d = JSON.parse(fs.readFileSync('news.json', 'utf8'));
            for (const i of d.items) if (i[7] && !fs.existsSync('pics/' + i[6].replace('/feeds/', ''))) { i[6] = i[8]; i[7] = 0; }
            fs.writeFileSync('news.json', JSON.stringify(d) + '\n');
            console.log(d.items.filter(i => i[7]).length + ' publisher thumbnails');"
          ls -la pics

      - name: Check the file
        run: python3 -c "import json; d = json.load(open('news.json')); n = len(d['items']); print(n, 'headlines'); assert n >= 4 and all(i[1].startswith('https://') and i[4].startswith('/') for i in d['items'])"

      # public_html/feeds is made by the deploy (scripts/deploy.sh); after a push the deploy may still be running: retry.
      # The thumbnails go first, so news.json never names a picture that is not there yet.
      - name: Write it to public_html/feeds
        run: |
          set -- pics/*.jpg
          if [ -e "$1" ]; then
            args=(); n=0; for f in "$@"; do n=$((n + 1)); args+=(-F "file-$n=@$f"); done
            ok=0
            for i in $(seq 1 8); do
              res=$(curl -sS "https://$HOST:2083/execute/Fileman/upload_files" \
                -H "Authorization: cpanel $USER:$TOKEN" \
                -F "dir=public_html/feeds" -F "overwrite=1" "${args[@]}")
              echo "$res" | jq -c '{status, errors}'
              [ "$(echo "$res" | jq -r .status)" = "1" ] && { ok=1; break; }
              sleep 30
            done
            if [ "$ok" != 1 ]; then   # no thumbnails on the host: every headline shows the Institute's picture instead
              echo "::warning::the thumbnails were not uploaded"
              node -e "const fs = require('fs'), d = JSON.parse(fs.readFileSync('news.json', 'utf8')); for (const i of d.items) if (i[7]) { i[6] = i[8]; i[7] = 0; } fs.writeFileSync('news.json', JSON.stringify(d) + '\n');"
            fi
          fi
          for i in $(seq 1 8); do
            res=$(curl -sS -X POST "https://$HOST:2083/execute/Fileman/save_file_content" \
              -H "Authorization: cpanel $USER:$TOKEN" \
              --data-urlencode "dir=public_html/feeds" \
              --data-urlencode "file=news.json" \
              --data-urlencode "from_charset=UTF-8" \
              --data-urlencode "to_charset=UTF-8" \
              --data-urlencode "content@news.json")
            echo "$res" | jq -c '{status, errors}'
            [ "$(echo "$res" | jq -r .status)" = "1" ] && exit 0
            res=$(curl -sS "https://$HOST:2083/execute/Fileman/upload_files" \
              -H "Authorization: cpanel $USER:$TOKEN" \
              -F "dir=public_html/feeds" -F "overwrite=1" -F "file-1=@news.json")
            echo "$res" | jq -c '{status, errors}'
            [ "$(echo "$res" | jq -r .status)" = "1" ] && exit 0
            sleep 30
          done
          echo "::error::cPanel did not take the headlines"; exit 1

      - name: Check it is live
        run: |
          sleep 5
          curl -sS "https://the-epoch-institute.org/feeds/news.json" | head -c 300; echo
