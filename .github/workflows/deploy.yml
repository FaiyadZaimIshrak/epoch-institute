# Deploys the site to public_html on every push to master, and from the Actions tab (Run workflow). scripts/deploy.sh
# does the work over SSH with rsync and copies exactly what .cpanel.yml copied, so cPanel's clone of the repository on
# the server is no longer needed. docs/DEPLOY.md explains the setup, dry runs, deploys by hand and rollbacks.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  a private key without a passphrase; its public key is authorized in cPanel → SSH Access
#   SSH_HOST         server905.web-hosting.com
#   SSH_PORT         21098 (Namecheap's SSH port on shared hosting)
#   SSH_USER         theeiorh
#
# Only master deploys for real: run from any other branch, the workflow is always a dry run.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (list what would change, change nothing)
        type: boolean
        default: true
      commit:
        description: Commit (full SHA), tag or branch to deploy instead of the branch above, e.g. to roll back
        type: string
        default: ''

# One deploy at a time. Dry runs wait in a queue of their own, so one never takes the place of a deploy that is
# waiting (GitHub cancels the waiting run when another joins the same queue).
concurrency:
  group: deploy-${{ (inputs.dry_run || github.ref != 'refs/heads/master') && 'dry-run' || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ (inputs.dry_run || github.ref != 'refs/heads/master') && '1' || '0' }}
    steps:
      - name: Check secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for v in SSH_PRIVATE_KEY SSH_HOST SSH_PORT SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v (see docs/DEPLOY.md)"; exit 1; }
          done
          if [ "$DRY_RUN" = 1 ]; then echo "Dry run: nothing on the server will change."; fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::SSH_PRIVATE_KEY is not a private key without a passphrase"; exit 1; }
          host=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          port=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          # the server's host key, so that ssh checks it (scripts/deploy.sh keeps StrictHostKeyChecking on)
          for try in 1 2 3; do
            if ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts 2> /dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            if [ "$try" -lt 3 ]; then sleep 10; fi
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::ssh-keyscan got no host key from the server"; exit 1; }
          echo "Host keys of the server (compare with the fingerprints in docs/DEPLOY.md):"
          ssh-keygen -lf ~/.ssh/known_hosts
          command -v rsync > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q rsync; }

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ ! -f scripts/deploy.sh ]; then
            echo "::error::This commit has no scripts/deploy.sh: it is older than deploys over SSH (to go back to it, revert with git and push)"
            exit 1
          fi
          SSH_KEY_FILE=~/.ssh/deploy_key bash scripts/deploy.sh

      - name: Check the site answers
        if: env.DRY_RUN != '1'
        run: |
          for path in / /encyclopedia/ /shared.css; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://the-epoch-institute.org$path")
            echo "$path $code"
            [ "$code" = 200 ] || { echo "::error::https://the-epoch-institute.org$path answered $code after the deploy"; exit 1; }
          done
