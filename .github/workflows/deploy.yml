# Deploys the site to public_html on every push to master, and from the Actions tab (Run workflow). scripts/deploy.sh
# does the work over SSH with rsync and copies exactly what .cpanel.yml copied when cPanel deployed from its own clone
# of the repository (both gone since 27 Oct 2026). docs/DEPLOY.md explains the setup, dry runs, deploys by hand and
# rollbacks.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  a private key without a passphrase; its public key is authorized in cPanel → SSH Access
#   SSH_HOST         server905.web-hosting.com
#   SSH_PORT         21098 (Namecheap's SSH port on shared hosting)
#   SSH_USER         theeiorh
#
# Only master deploys for real: run from any other branch, the workflow is always a dry run.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (list what would change, change nothing)
        type: boolean
        default: true
      commit:
        description: Commit (full SHA), tag or branch to deploy instead of the branch above, e.g. to roll back
        type: string
        default: ''

# One deploy at a time. Dry runs wait in a queue of their own, so one never takes the place of a deploy that is
# waiting (GitHub cancels the waiting run when another joins the same queue).
concurrency:
  group: deploy-${{ (inputs.dry_run || github.ref != 'refs/heads/master') && 'dry-run' || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The site's own checks before anything is sent (since 7 Nov 2026): scripts/check-site.ps1 (every internal link, one
  # h1, title, description, canonical and JSON-LD per page, every page served as HTML, css/ current) and
  # scripts/tools/crawl-static.js --strict (missing pictures and files, template leftovers, notes to the editor, bad
  # JSON-LD). check-site needs Windows PowerShell 5.1, so this job runs on Windows; a fault stops the deploy.
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: check-site
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-site.ps1

      - name: crawl-static
        run: node scripts/tools/crawl-static.js --strict --max=5

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ (inputs.dry_run || github.ref != 'refs/heads/master') && '1' || '0' }}
    steps:
      - name: Check secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for v in SSH_PRIVATE_KEY SSH_HOST SSH_PORT SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v (see docs/DEPLOY.md)"; exit 1; }
          done
          if [ "$DRY_RUN" = 1 ]; then echo "Dry run: nothing on the server will change."; fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # a pasted key that does not load: say what is wrong with it, without showing it
          if ! err=$(ssh-keygen -y -P '' -f ~/.ssh/deploy_key 2>&1 > /dev/null); then
            if grep -q '^ssh-' ~/.ssh/deploy_key; then why="it is the public key (a line starting ssh-): paste the private key file, the one without .pub"
            elif ! grep -q 'PRIVATE KEY-----' ~/.ssh/deploy_key; then why="it has no BEGIN ... PRIVATE KEY line: paste the whole private key file"
            elif [ "$(wc -l < ~/.ssh/deploy_key)" -lt 3 ]; then why="its line breaks are gone: paste the file as it is, one line under the other"
            elif printf '%s' "$err" | grep -qi passphrase; then why="it has a passphrase: make a key without one"
            else why="ssh-keygen says: $err"; fi
            echo "::error::SSH_PRIVATE_KEY is not a usable private key: $why (docs/DEPLOY.md, One-time setup)"
            exit 1
          fi
          host=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          port=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          # the server's host key, so that ssh checks it (scripts/deploy.sh keeps StrictHostKeyChecking on)
          for try in 1 2 3; do
            if ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts 2> /dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            if [ "$try" -lt 3 ]; then sleep 10; fi
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::ssh-keyscan got no host key from the server"; exit 1; }
          echo "Host keys of the server (compare with the fingerprints in docs/DEPLOY.md):"
          ssh-keygen -lf ~/.ssh/known_hosts
          command -v rsync > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q rsync; }

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ ! -f scripts/deploy.sh ]; then
            echo "::error::This commit has no scripts/deploy.sh: it is older than deploys over SSH (to go back to it, revert with git and push)"
            exit 1
          fi
          SSH_KEY_FILE=~/.ssh/deploy_key bash scripts/deploy.sh

      # Cloudflare keeps the pages near the readers (a Cache Rule, docs/CLOUDFLARE.md "Pages at the edge"): after every
      # deploy it is told to forget them, so nobody sees a page older than the deploy. Skipped while the two secrets
      # are not set (then Cloudflare does not keep pages either, so there is nothing to forget).
      - name: Purge Cloudflare's copies
        if: env.DRY_RUN != '1'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then echo "No Cloudflare secrets: nothing to purge"; exit 0; fi
          zone=$(printf '%s' "$CF_ZONE" | tr -d '[:space:]')
          out=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}')
          echo "$out" | grep -q '"success":true' || { echo "::error::Cloudflare purge failed: $out"; exit 1; }
          echo "Cloudflare's copies purged"

      - name: Check the site answers
        if: env.DRY_RUN != '1'
        run: |
          for path in / /encyclopedia/ /shared.css; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://the-epoch-institute.org$path")
            echo "$path $code"
            [ "$code" = 200 ] || { echo "::error::https://the-epoch-institute.org$path answered $code after the deploy"; exit 1; }
          done
