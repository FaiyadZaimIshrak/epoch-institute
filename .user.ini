; PHP settings for send.php, the site's mail handler (the only PHP on the site): an article's file up to 10 MB, and no
; PHP warnings printed into its answers (one before the script starts, e.g. a request over post_max_size, would turn
; its JSON into an unreadable page). The host reads this file within 5 minutes; GET /send.php shows maxUpload.
