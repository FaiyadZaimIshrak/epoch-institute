; PHP settings for send.php, the site's mail handler (the only PHP on the site): a request limit near its 10 MB files,
; and no PHP warnings printed into its answers. The host did not read this file on 29 Oct 2026 (GET /send.php still
; showed its own 1 GB limit), so send.php does the work itself (its 10 MB check, ini_set display_errors 0); the file
; stays for a host that reads it.
upload_max_filesize = 10M
post_max_size = 12M
display_errors = Off
log_errors = On
